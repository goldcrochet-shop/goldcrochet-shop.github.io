<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Gold Crochet — Redirecionando</title>
  <meta name="description" content="Página não encontrada ou redirecionando para o ateliê Gold Crochet Brasil.">

  <!-- OpenGraph -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Gold Crochet Brasil — Alta-Costura em Crochê Artesanal">
  <meta property="og:description" content="Ateliê de alta-costura brasileira especializado em crochê manual com fios nobres.">
  <meta property="og:image" content="./assets/logo.png">
  <meta property="og:url" content="https://goldcrochet-shop.github.io/404.html">
  <meta property="og:site_name" content="Gold Crochet Brasil">

  <!-- Twitter Cards -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Gold Crochet Brasil — Alta-Costura em Crochê Artesanal">
  <meta name="twitter:description" content="Ateliê de alta-costura brasileira especializado em crochê manual com fios nobres.">
  <meta name="twitter:image" content="./assets/logo.png">
  
  <!-- Búzio Dourado Favicon -->
  <link rel="icon" type="image/svg+xml" href="./assets/icon.svg?v=buzio2026">
  <link rel="icon" type="image/png" sizes="64x64" href="./assets/icon.png?v=buzio2026">
  <link rel="shortcut icon" href="./favicon.ico?v=buzio2026">
  <link rel="apple-touch-icon" sizes="180x180" href="./assets/icon.png?v=buzio2026">

  <style>
    body {
      margin: 0;
      padding: 0;
      background: #0d0a06;
      color: #cda434;
      font-family: 'Outfit', sans-serif, system-ui;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
    }
    .logo {
      width: 80px;
      height: 80px;
      margin-bottom: 20px;
      animation: pulse 2s infinite ease-in-out;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 0.9; }
      50% { transform: scale(1.05); opacity: 1; }
    }
    h1 {
      font-family: 'DM Serif Display', Georgia, serif;
      font-size: 1.8rem;
      margin: 0 0 10px;
      color: #f6e08c;
    }
    p {
      color: #c9b686;
      font-size: 0.95rem;
      margin: 0 0 24px;
    }
    .btn {
      display: inline-block;
      background: #cda434;
      color: #0d0a06;
      padding: 12px 28px;
      border-radius: 999px;
      text-decoration: none;
      font-weight: 700;
      font-size: 0.9rem;
      transition: all 0.2s;
    }
    .btn:hover {
      background: #f6e08c;
      transform: translateY(-2px);
    }
  </style>

  <script>
    // GitHub Pages Traditional HTML & Slug Redirector
    (function() {
      var pathname = window.location.pathname;
      var repoPrefix = '';
      if (pathname.indexOf('/goldcrochet-shop') === 0) {
        repoPrefix = '/goldcrochet-shop';
      }
      var clean = pathname.replace(/^\/goldcrochet-shop/, '').replace(/^\/+/, '').replace(/\/+$/, '');

      // 1. Redirecionamento para o Admin (/admin -> /admin.html)
      if (clean === 'admin' || clean === 'admin/') {
        window.location.replace(window.location.origin + repoPrefix + '/admin.html' + window.location.search + window.location.hash);
        return;
      }

      // 2. Redirecionamento para páginas principais
      if (clean === 'colecoes' || clean === 'colecoes/') {
        window.location.replace(window.location.origin + repoPrefix + '/colecoes.html');
        return;
      }
      if (clean === 'pecas' || clean === 'pecas/' || clean === 'catalogo') {
        window.location.replace(window.location.origin + repoPrefix + '/pecas.html');
        return;
      }
      if (clean === 'novidades' || clean === 'novidades/') {
        window.location.replace(window.location.origin + repoPrefix + '/novidades.html');
        return;
      }
      if (clean === 'casa-gold' || clean === 'casa-gold/' || clean === 'casa') {
        window.location.replace(window.location.origin + repoPrefix + '/casa-gold.html');
        return;
      }
      if (clean === 'cliente' || clean === 'cliente/' || clean === 'conta' || clean === 'conta/' || clean === 'perfil' || clean === 'vip') {
        window.location.replace(window.location.origin + repoPrefix + '/cliente.html');
        return;
      }

      // 3. Redirecionamento de páginas de produtos físicas ou dinâmicas
      if (clean && !clean.includes('.')) {
        var slug = clean.replace(/^(produtos|produto)\//, '');
        // Se já tentou acessar o .html e caiu no 404, encaminha para o visualizador dinâmico
        if (clean.indexOf('produtos/') === 0 || clean.indexOf('produto/') === 0) {
          window.location.replace(window.location.origin + repoPrefix + '/produtos/produto.html?slug=' + encodeURIComponent(slug));
          return;
        }
        window.location.replace(window.location.origin + repoPrefix + '/produtos/' + slug + '.html');
        return;
      }

      // Se acessou diretamente .html de produto inexistente (ex: /produtos/xyz.html), vai para o produto.html dinâmico
      if (clean && clean.indexOf('produtos/') === 0 && clean.endsWith('.html') && clean !== 'produtos/produto.html') {
        var fileSlug = clean.replace(/^produtos\//, '').replace(/\.html$/, '');
        window.location.replace(window.location.origin + repoPrefix + '/produtos/produto.html?slug=' + encodeURIComponent(fileSlug));
        return;
      }

      // 4. Fallback geral para o Início
      window.location.replace(window.location.origin + repoPrefix + '/index.html');
    })();
  </script>
</head>
<body>
  <img src="./assets/icon.svg" alt="Gold Crochet" class="logo">
  <h1>Ateliê Gold Crochet</h1>
  <p>Redirecionando você para a página solicitada...</p>
  <a href="./index.html" class="btn">Ir para o Início</a>
</body>
</html>
