<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Coleções — Gold Crochet Brasil</title>
  <meta name="description" content="Explore as coleções exclusivas da Gold Crochet Brasil: Maré D'ouro, Casa Gold e Essenciais. Peças em carrosséis horizontais tecidas à mão.">
  <link rel="canonical" href="https://goldcrochet-shop.github.io/colecoes.html">
  <meta name="theme-color" content="#cda434">

  <!-- OpenGraph -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Coleções — Gold Crochet Brasil">
  <meta property="og:description" content="Explore as coleções exclusivas da Gold Crochet Brasil em carrosséis horizontais: Maré D'ouro, Casa Gold e Essenciais.">
  <meta property="og:image" content="./assets/logo.png">
  <meta property="og:url" content="https://goldcrochet-shop.github.io/colecoes.html">
  <meta property="og:site_name" content="Gold Crochet Brasil">

  <!-- Twitter Cards -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Coleções — Gold Crochet Alta-Costura">
  <meta name="twitter:description" content="Explore as coleções exclusivas da Gold Crochet Brasil em carrosséis horizontais: Maré D'ouro, Casa Gold e Essenciais.">
  <meta name="twitter:image" content="./assets/logo.png">

  <!-- Favicons -->
  <link rel="icon" type="image/svg+xml" href="./assets/icon.svg?v=buzio2026">
  <link rel="icon" type="image/png" sizes="64x64" href="./assets/icon.png?v=buzio2026">
  <link rel="shortcut icon" href="./favicon.ico?v=buzio2026">
  <link rel="apple-touch-icon" sizes="180x180" href="./assets/icon.png?v=buzio2026">

  <!-- Fontes de Luxo -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=DM+Serif+Display:ital@0;1&family=Playfair+Display:ital,wght@0,600;0,700;1,400&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="./style.css?v=2026">
  <link rel="stylesheet" href="./css/luxury-core.css?v=2026">

  <style>
    .gc-collection-block {
      margin-bottom: 70px;
    }
    .gc-collection-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--color-border);
      margin-bottom: 24px;
      flex-wrap: wrap;
      gap: 16px;
    }
    .gc-collection-header-info h2 {
      font-family: var(--font-display);
      font-size: clamp(1.6rem, 3.5vw, 2.1rem);
      color: var(--color-ebony);
      margin: 0 0 6px 0;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .gc-collection-header-info p {
      color: var(--color-muted);
      font-size: 0.92rem;
      margin: 0;
      max-width: 620px;
      line-height: 1.5;
    }
    .gc-collection-actions-row {
      display: flex;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap;
    }
    .gc-collection-link-btn {
      font-family: var(--font-body);
      font-size: 0.85rem;
      color: var(--color-gold-deep);
      text-decoration: none;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      transition: color 0.2s;
    }
    .gc-collection-link-btn:hover {
      color: var(--color-ebony);
    }
    .gc-carousel-arrow-btn {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: 1px solid var(--color-border);
      background: var(--color-surface);
      color: var(--color-gold-deep);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 2px 6px rgba(0,0,0,0.04);
    }
    .gc-carousel-arrow-btn:hover {
      background: var(--color-gold-deep);
      color: #fff;
      border-color: var(--color-gold-deep);
      transform: scale(1.05);
    }
    .gc-carousel-viewport {
      position: relative;
      overflow: hidden;
      width: 100%;
    }
    .gc-carousel-track {
      display: flex;
      gap: 22px;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      scroll-behavior: smooth;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
      cursor: grab;
      user-select: none;
      padding-bottom: 8px;
    }
    .gc-carousel-track::-webkit-scrollbar {
      display: none;
    }
    .gc-carousel-track.grabbing {
      cursor: grabbing;
      scroll-behavior: auto;
      scroll-snap-type: none;
    }
    .gc-carousel-track .gc-product-card {
      flex: 0 0 300px;
      max-width: 300px;
      scroll-snap-align: start;
    }
    @media (max-width: 640px) {
      .gc-carousel-track .gc-product-card {
        flex: 0 0 76vw;
        max-width: 76vw;
      }
    }
  </style>
</head>
<body>

  <main class="gc-container">
    <!-- Hero da Página -->
    <header class="gc-page-hero">
      <span class="gc-page-hero-tag">Curadoria de Alta-Costura</span>
      <h1 class="gc-page-hero-title">Coleções Exclusivas</h1>
      <p class="gc-page-hero-desc">
        Narrativas tecidas à mão. Cada coleção traz nomes dispostos em carrosséis horizontais com deslize suave, revelando a Maré D'ouro, a Casa Gold e as peças icônicas do nosso ateliê.
      </p>
    </header>

    <!-- Container Dinâmico das Coleções (Sincronizado com Admin/data.json) -->
    <div id="collectionsContainer">
      <div style="text-align:center;padding:50px 20px;color:var(--color-muted);">
        <p>Carregando coleções exclusivas...</p>
      </div>
    </div>
  </main>

  <!-- Scripts Essenciais de Luxo -->
  <script src="./js/loader.js?v=2026"></script>
  <script src="./js/shared-ui.js?v=2026"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const container = document.getElementById('collectionsContainer');
      if (!container) return;

      let catalogProducts = [];
      let collectionsList = [];

      try {
        const resp = await fetch('./data.json?t=' + Date.now());
        if (resp.ok) {
          const data = await resp.json();
          catalogProducts = data.products || [];
          collectionsList = data.collections || [];
        }
      } catch (err) {
        console.warn('Erro ao carregar data.json para coleções:', err);
      }

      if (!catalogProducts.length && window.fetchCatalog) {
        catalogProducts = await window.fetchCatalog();
      }

      // Se não houver coleções definidas no data.json, utiliza as padrão com Maré D'ouro e Casa Gold
      if (!collectionsList || !collectionsList.length) {
        collectionsList = [
          {
            id: 'mare-douro',
            name: "Maré D'ouro",
            filter: "Maré D'ouro",
            emoji: "🌊",
            desc: "Peças versáteis inspiradas no balanço do mar, na brisa do litoral e no brilho do ouro."
          },
          {
            id: 'casa-gold',
            name: "Casa Gold",
            filter: "Casa Gold",
            emoji: "🏛️",
            desc: "Coleção patrimônio tecida à mão: requinte atemporal, peças nobres e harmonia para o lar."
          },
          {
            id: 'essenciais',
            name: "Essenciais",
            filter: "Essenciais",
            emoji: "✨",
            desc: "Silhuetas icônicas e pontos estruturados essenciais do ateliê Gold Crochet Brasil."
          }
        ];
      }

      function renderProductCard(p) {
        const slug = p.slug || 'produto';
        const priceStr = p.price ? `R$ ${Number(p.price).toFixed(2).replace('.', ',')}` : 'Sob Consulta';
        const img = p.image || (p.gallery && p.gallery[0]) || './assets/icon.svg';
        const hasDiscount = p.discount && Number(p.discount) > 0;
        
        let badgeHtml = '';
        if (hasDiscount) {
          badgeHtml = `<span class="gc-badge-discount-vertical">-${p.discount}% OFF</span>`;
        } else if (p.badge) {
          badgeHtml = `<span class="gc-badge-vertical">${p.badge}</span>`;
        }

        return `
          <div class="gc-product-card" onclick="if(!window.__gcCarouselDragged) window.location.href='./produtos/${slug}.html'" style="cursor:pointer">
            <div class="gc-product-card-img-wrap">
              ${badgeHtml}
              <button class="gc-card-fav-btn" data-id="${p.id}" onclick="event.stopPropagation(); window.GoldFav && window.GoldFav.toggle(${p.id});" aria-label="Favoritar">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path>
                </svg>
              </button>
              <img src="${img}" alt="${p.name}" class="gc-product-card-img" loading="lazy" onerror="this.src='./assets/icon.svg'">
            </div>
            <div class="gc-product-card-body">
              <span class="gc-product-category">${p.collection || p.category || 'Ateliê'}</span>
              <h3 class="gc-product-title">${p.name}</h3>
              <p class="gc-product-desc">${p.desc || ''}</p>
              <div class="gc-product-price-row">
                <span class="gc-product-price">${priceStr}</span>
              </div>
            </div>
          </div>
        `;
      }

      container.innerHTML = collectionsList.map((col, idx) => {
        // Encontra produtos associados à coleção
        let prods = catalogProducts.filter(p => {
          const colName = (col.filter || col.name || '').toLowerCase();
          const pCol = (p.collection || '').toLowerCase();
          const pName = (p.name || '').toLowerCase();
          const pCat = (p.category || '').toLowerCase();
          const pSec = (p.section || '').toLowerCase();

          if (colName.includes('maré') || colName.includes('mare')) {
            return pCol.includes('maré') || pCol.includes('mare') || pName.includes('noronha') || pName.includes('trancoso') || pName.includes('bossa') || pName.includes('arpoador');
          }
          if (colName.includes('casa gold') || colName.includes('casa')) {
            return pCol.includes('casa gold') || pSec === 'casa' || pCat === 'decoracoes' || pCat === 'mantas' || pName.includes('celestial') || pName.includes('jogo americano');
          }
          if (colName.includes('essenciais')) {
            return pCol.includes('essenciais') || pCat === 'bolsas' || pCat === 'saias-vestidos' || pCat === 'tops';
          }
          return pCol === colName || pCol.includes(colName);
        });

        // Se uma coleção não tiver produtos filtrados diretamente, inclui peças padrão para exibição rica
        if (!prods.length) {
          prods = catalogProducts.slice(0, 4);
        }

        const trackId = `carouselTrackCol_${idx}`;
        const prevId = `prevBtnCol_${idx}`;
        const nextId = `nextBtnCol_${idx}`;

        return `
          <section class="gc-collection-block" id="colecao-${col.id || idx}">
            <div class="gc-collection-header">
              <div class="gc-collection-header-info">
                <h2>${col.emoji || '✨'} ${col.name}</h2>
                <p>${col.desc || 'Peças exclusivas feitas à mão com os pontos mais nobres do crochê brasileiro.'}</p>
              </div>
              <div class="gc-collection-actions-row">
                <a href="./pecas.html?cat=${encodeURIComponent(col.filter || col.name)}" class="gc-collection-link-btn">Ver Coleção Completa &rarr;</a>
                <div style="display:flex;gap:8px">
                  <button id="${prevId}" class="gc-carousel-arrow-btn" aria-label="Voltar" title="Anterior">&lt;</button>
                  <button id="${nextId}" class="gc-carousel-arrow-btn" aria-label="Avançar" title="Próximo">&gt;</button>
                </div>
              </div>
            </div>

            <div class="gc-carousel-viewport">
              <div id="${trackId}" class="gc-carousel-track">
                ${prods.map(renderProductCard).join('')}
              </div>
            </div>
          </section>
        `;
      }).join('');

      // Inicializa interatividade de carrossel (touch, drag por mouse e botões de seta)
      collectionsList.forEach((_, idx) => {
        const track = document.getElementById(`carouselTrackCol_${idx}`);
        const prev = document.getElementById(`prevBtnCol_${idx}`);
        const next = document.getElementById(`nextBtnCol_${idx}`);
        if (!track) return;

        let isDown = false;
        let startX = 0;
        let startScroll = 0;
        let hasMoved = false;

        track.addEventListener('mousedown', (e) => {
          isDown = true;
          hasMoved = false;
          window.__gcCarouselDragged = false;
          startX = e.pageX;
          startScroll = track.scrollLeft;
          track.classList.add('grabbing');
          track.style.scrollBehavior = 'auto';
        });

        window.addEventListener('mousemove', (e) => {
          if (!isDown) return;
          const dx = e.pageX - startX;
          if (Math.abs(dx) > 6) {
            hasMoved = true;
            window.__gcCarouselDragged = true;
          }
          track.scrollLeft = startScroll - dx;
        });

        window.addEventListener('mouseup', () => {
          if (!isDown) return;
          isDown = false;
          track.classList.remove('grabbing');
          track.style.scrollBehavior = 'smooth';
          setTimeout(() => { window.__gcCarouselDragged = false; }, 100);
        });

        if (prev) {
          prev.addEventListener('click', () => {
            track.scrollBy({ left: -320, behavior: 'smooth' });
          });
        }
        if (next) {
          next.addEventListener('click', () => {
            track.scrollBy({ left: 320, behavior: 'smooth' });
          });
        }
      });

      if (window.GoldFav && window.GoldFav.updateUI) {
        window.GoldFav.updateUI();
      }
    });
  </script>
</body>
</html>
