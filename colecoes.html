<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Coleções — Gold Crochet Brasil</title>
  <meta name="description" content="Explore as coleções exclusivas da Gold Crochet Brasil: Essenciais, Alto Verão e Casa Brasil. Peças artesanais em crochê feitas à mão com fios nobres.">
  <link rel="canonical" href="https://goldcrochet-shop.github.io/colecoes.html">
  <meta name="theme-color" content="#cda434">

  <!-- OpenGraph -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Coleções — Gold Crochet Brasil">
  <meta property="og:description" content="Explore as coleções exclusivas da Gold Crochet: Essenciais, Alto Verão e Casa Brasil. Peças artesanais em crochê feitas à mão com fios nobres.">
  <meta property="og:image" content="./assets/logo.png">
  <meta property="og:url" content="https://goldcrochet-shop.github.io/colecoes.html">
  <meta property="og:site_name" content="Gold Crochet Brasil">

  <!-- Twitter Cards -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Coleções — Gold Crochet Alta-Costura">
  <meta name="twitter:description" content="Explore as coleções exclusivas da Gold Crochet: Essenciais, Alto Verão e Casa Brasil. Peças artesanais em crochê feitas à mão com fios nobres.">
  <meta name="twitter:image" content="./assets/logo.png">

  <!-- Favicons -->
  <link rel="icon" type="image/svg+xml" href="./assets/icon.svg?v=buzio2026">
  <link rel="icon" type="image/png" sizes="64x64" href="./assets/icon.png?v=buzio2026">
  <link rel="shortcut icon" href="./favicon.ico?v=buzio2026">
  <link rel="apple-touch-icon" sizes="180x180" href="./assets/icon.png?v=buzio2026">

  <!-- Fontes de Luxo -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=DM+Serif+Display:ital@0;1&family=Playfair+Display:ital,wght@0,600;0,700;1,400&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="./style.css?v=2026">
  <link rel="stylesheet" href="./css/luxury-core.css?v=2026">

  <style>
    .gc-collection-banner {
      position: relative;
      background: linear-gradient(135deg, #181614 0%, #2e2a25 100%);
      color: white;
      border-radius: var(--radius-lg);
      padding: 60px 40px;
      margin: 40px auto 60px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: center;
      max-width: 1400px;
      border: 1px solid rgba(205, 164, 52, 0.3);
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.15);
    }
    .gc-collection-banner::after {
      content: '';
      position: absolute;
      right: -50px;
      top: -50px;
      width: 320px;
      height: 320px;
      background: radial-gradient(circle, rgba(205,164,52,0.25) 0%, transparent 70%);
      border-radius: 50%;
      pointer-events: none;
    }
    .gc-collection-title {
      font-family: var(--font-display);
      font-size: clamp(2rem, 4vw, 3rem);
      margin-bottom: 12px;
      color: #fff8db;
    }
    .gc-collection-desc {
      font-size: 1rem;
      color: rgba(255, 255, 255, 0.75);
      max-width: 650px;
      line-height: 1.6;
    }
    .gc-collection-section {
      margin-bottom: 70px;
    }
    .gc-collection-section-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--color-border);
      margin-bottom: 28px;
    }
    .gc-collection-section-header h2 {
      font-family: var(--font-display);
      font-size: 1.8rem;
      color: var(--color-ebony);
    }
    .gc-collection-section-header a {
      font-family: var(--font-body);
      font-size: 0.85rem;
      color: var(--color-gold-deep);
      text-decoration: none;
      font-weight: 600;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      transition: color 0.2s;
    }
    .gc-collection-section-header a:hover {
      color: var(--color-ebony);
    }
  </style>
</head>
<body>

  <main class="gc-container">
    <!-- Hero da Página -->
    <header class="gc-page-hero">
      <span class="gc-page-hero-tag">Curadoria de Alta-Costura</span>
      <h1 class="gc-page-hero-title">Coleções Exclusivas</h1>
      <p class="gc-page-hero-desc">
        Narrativas tecidas à mão. Cada coleção expressa um momento da nossa identidade: a luz da costa brasileira, o aconchego do lar e o requinte atemporal do crochê.
      </p>
    </header>

    <!-- Contêiner Dinâmico de Coleções Sincronizado com o Admin -->
    <div id="collectionsDynamicContainer">
      <!-- Injetado dinamicamente via JS -->
    </div>
  </main>

  <!-- Scripts Essenciais de Luxo -->
  <script src="./js/loader.js?v=2026"></script>
  <script src="./js/shared-ui.js?v=2026"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const products = await window.fetchCatalog();
      if (!products || !products.length) return;

      // Busca coleções do Firestore ou Cache Local
      let collections = [];
      try {
        const cached = localStorage.getItem('gc_cached_collections');
        if (cached) collections = JSON.parse(cached);
      } catch(e) {}

      if (!collections.length) {
        collections = [
          { id: 'essenciais', slug: 'Essenciais', name: 'Coleção Essenciais', icon: '🧶', desc: 'O luxo despretensioso das formas puras e peças atemporais para qualquer ocasião.' },
          { id: 'alto-verao', slug: 'alto-verao', name: 'Alto Verão & Resort', icon: '☀️', desc: 'Leveza e fluidez sob a luz tropical: vestidos, regatas e bolsas de palha e algodão.' },
          { id: 'casa-brasil', slug: 'casa-brasil', name: 'Coleção Casa Brasil', icon: '🏡', desc: 'Aconchego botânico e requinte à mesa posta em peças de puro algodão.' }
        ];
      }

      function renderCard(p) {
        const slug = p.slug || 'produto';
        const priceStr = p.price ? `R$ ${Number(p.price).toFixed(2).replace('.', ',')}` : 'Sob Consulta';
        const img = p.image || (p.gallery && p.gallery[0]) || './assets/icon.svg';
        const badge = p.badge ? `<span class="gc-badge-tag">${p.badge}</span>` : '';

        return `
          <div class="gc-product-card" onclick="window.location.href='./produtos/${slug}.html'" style="cursor:pointer;flex:0 0 280px;scroll-snap-align:start;">
            <div class="gc-product-card-img-wrap">
              ${badge}
              <button class="gc-card-fav-btn" data-id="${p.id}" onclick="event.stopPropagation(); window.GoldFav.toggle(${p.id});" aria-label="Favoritar">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path>
                </svg>
              </button>
              <img src="${img}" alt="${p.name}" class="gc-product-card-img" loading="lazy" onerror="this.src='./assets/icon.svg'">
            </div>
            <div class="gc-product-card-body">
              <span class="gc-product-category">${p.collection || p.category || 'Ateliê'}</span>
              <h3 class="gc-product-title">${p.name}</h3>
              <p class="gc-product-desc">${p.desc || ''}</p>
              <div class="gc-product-price-row">
                <span class="gc-product-price">${priceStr}</span>
              </div>
            </div>
          </div>
        `;
      }

      const container = document.getElementById('collectionsDynamicContainer');
      if (!container) return;

      container.innerHTML = collections.map((col, cIdx) => {
        // Filtra peças pertencentes à coleção
        let colProducts = products.filter(p => {
          if (p.collection && (p.collection.toLowerCase() === col.name.toLowerCase() || p.collection.toLowerCase() === col.slug.toLowerCase())) return true;
          if (col.slug === 'Essenciais' && p.category === 'bolsas') return true;
          if (col.slug === 'alto-verao' && (p.category === 'vestuario' || p.category === 'saias-vestidos' || p.category === 'tops')) return true;
          if (col.slug === 'casa-brasil' && (p.category === 'casa-gold' || p.category === 'decoracoes' || p.section === 'casa')) return true;
          return false;
        });

        if (!colProducts.length) {
          colProducts = products.slice(cIdx * 2, (cIdx * 2) + 4);
        }

        // Duplicação para loop infinito no carrossel
        const infiniteItems = colProducts.length >= 2 ? [...colProducts, ...colProducts, ...colProducts] : colProducts;
        const trackId = `trackCol_${cIdx}`;

        return `
          <section class="gc-collection-section" style="margin-bottom:70px">
            <div class="gc-collection-section-header" style="display:flex;justify-content:space-between;align-items:flex-end;padding-bottom:16px;border-bottom:1px solid var(--color-border);margin-bottom:24px;flex-wrap:wrap;gap:12px">
              <div>
                <h2 style="font-family:var(--font-display);font-size:1.85rem;color:var(--color-ebony);margin:0 0 6px">${col.name}</h2>
                <p style="color:var(--color-muted);font-size:0.9rem;margin:0;max-width:650px">${col.desc || ''}</p>
              </div>
              <div style="display:flex;align-items:center;gap:12px">
                <a href="./pecas.html?colecao=${encodeURIComponent(col.slug)}" style="color:var(--color-gold-deep);text-decoration:none;font-weight:700;font-size:0.86rem;letter-spacing:0.04em">
                  Ver Coleção Completa &gt;
                </a>
                <div style="display:flex;gap:6px">
                  <button class="gc-carousel-arrow-btn" onclick="const t=document.getElementById('${trackId}'); if(t) t.scrollBy({left:-300,behavior:'smooth'});" aria-label="Voltar">&lt;</button>
                  <button class="gc-carousel-arrow-btn" onclick="const t=document.getElementById('${trackId}'); if(t) t.scrollBy({left:300,behavior:'smooth'});" aria-label="Avançar">&gt;</button>
                </div>
              </div>
            </div>
            <div class="gc-carousel-viewport" style="position:relative;overflow:hidden;width:100%;padding-bottom:16px">
              <div id="${trackId}" class="gc-carousel-track" style="display:flex;gap:20px;overflow-x:auto;scroll-snap-type:x mandatory;scroll-behavior:smooth;-webkit-overflow-scrolling:touch">
                ${infiniteItems.map(renderCard).join('')}
              </div>
            </div>
          </section>
        `;
      }).join('');

      // Adiciona listener de loop infinito para cada carrossel de coleção
      collections.forEach((col, cIdx) => {
        const track = document.getElementById(`trackCol_${cIdx}`);
        if (!track) return;
        track.addEventListener('scroll', () => {
          const half = track.scrollWidth / 2;
          if (track.scrollLeft >= half) {
            track.scrollLeft -= half;
          } else if (track.scrollLeft <= 5) {
            track.scrollLeft += half;
          }
        }, { passive: true });
      });

      if (window.GoldFav && window.GoldFav.updateUI) {
        window.GoldFav.updateUI();
      }
    });
  </script>
</body>
</html>
