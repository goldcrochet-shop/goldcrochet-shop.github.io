<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Peças — Gold Crochet Brasil</title>
  <meta name="description" content="Catálogo completo de criações artesanais da Gold Crochet Brasil. Vestuário, bolsas, peças sob medida e mesa posta feitas à mão.">
  <link rel="canonical" href="https://goldcrochet-shop.github.io/pecas.html">
  <meta name="theme-color" content="#cda434">

  <!-- OpenGraph -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Peças — Gold Crochet Brasil">
  <meta property="og:description" content="Catálogo completo de criações artesanais da Gold Crochet Brasil. Vestuário, bolsas, peças sob medida e mesa posta feitas à mão.">
  <meta property="og:image" content="./assets/logo.png">
  <meta property="og:url" content="https://goldcrochet-shop.github.io/pecas.html">
  <meta property="og:site_name" content="Gold Crochet Brasil">

  <!-- Twitter Cards -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Peças — Gold Crochet Brasil">
  <meta name="twitter:description" content="Catálogo completo de criações artesanais da Gold Crochet Brasil. Vestuário, bolsas, peças sob medida e mesa posta feitas à mão.">
  <meta name="twitter:image" content="./assets/logo.png">

  <!-- Favicons -->
  <link rel="icon" type="image/svg+xml" href="./assets/icon.svg?v=buzio2026">
  <link rel="icon" type="image/png" sizes="64x64" href="./assets/icon.png?v=buzio2026">
  <link rel="shortcut icon" href="./favicon.ico?v=buzio2026">
  <link rel="apple-touch-icon" sizes="180x180" href="./assets/icon.png?v=buzio2026">

  <!-- Fontes de Luxo -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=DM+Serif+Display:ital@0;1&family=Playfair+Display:ital,wght@0,600;0,700;1,400&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="./style.css?v=2026">
  <link rel="stylesheet" href="./css/luxury-core.css?v=2026">

  <style>
    .gc-catalog-controls {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      margin-bottom: 36px;
    }
    .gc-search-box {
      position: relative;
      width: 100%;
      max-width: 480px;
    }
    .gc-search-input {
      width: 100%;
      padding: 12px 18px 12px 42px;
      border-radius: var(--radius-pill);
      border: 1px solid var(--color-border);
      background: white;
      font-family: var(--font-body);
      font-size: 0.9rem;
      outline: none;
      transition: var(--transition-smooth);
    }
    .gc-search-input:focus {
      border-color: var(--color-gold);
      box-shadow: 0 0 16px var(--color-gold-glow);
    }
    .gc-search-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--color-muted);
      pointer-events: none;
    }
    .gc-empty-results {
      text-align: center;
      padding: 60px 20px;
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }
    .gc-results-counter {
      font-size: 0.85rem;
      color: var(--color-muted);
      letter-spacing: 0.05em;
      text-transform: uppercase;
      font-weight: 500;
    }
  </style>
</head>
<body>

  <main class="gc-container">
    <!-- Hero do Catálogo -->
    <header class="gc-page-hero">
      <span class="gc-page-hero-tag">Catálogo Completo</span>
      <h1 class="gc-page-hero-title">Todas as Peças</h1>
      <p class="gc-page-hero-desc">
        Explore nosso acervo completo de criações tecidas à mão. Cada ponto, textura e acabamento é desenhado para durar gerações.
      </p>
    </header>

    <!-- Controles & Filtros -->
    <section class="gc-catalog-controls">
      <div class="gc-search-box">
        <svg class="gc-search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <input type="text" id="catalogSearch" class="gc-search-input" placeholder="Buscar por peça, tecido ou nome..." autocomplete="off">
      </div>

      <div class="gc-filters-bar" id="filtersBar">
        <button class="gc-filter-pill active" data-filter="all">Todas as Peças</button>
        <button class="gc-filter-pill" data-filter="ela">Para Ela</button>
        <button class="gc-filter-pill" data-filter="ele">Para Ele</button>
        <button class="gc-filter-pill" data-filter="noite">Roupas para Noite</button>
        <button class="gc-filter-pill" data-filter="vestuario">Vestuário</button>
        <button class="gc-filter-pill" data-filter="bolsas">Bolsas</button>
        <button class="gc-filter-pill" data-filter="casa">Casa Gold &amp; Decor</button>
        <button class="gc-filter-pill" data-filter="pequeninos">Pequeninos</button>
        <button class="gc-filter-pill" data-filter="bijuterias">Bijuterias &amp; Charms</button>
        <button class="gc-filter-pill" data-filter="personalizado">Sob Medida</button>
        <button class="gc-filter-pill" data-filter="favoritos">Meus Favoritos</button>
      </div>

      <span class="gc-results-counter" id="resultsCount">Carregando acervo...</span>
    </section>

    <!-- Grade de Produtos -->
    <section id="catalogGrid" class="gc-grid-products">
      <!-- Injetado dinamicamente via JS -->
    </section>

    <!-- Mensagem de Vazio -->
    <div id="catalogEmpty" class="gc-empty-results">
      <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="var(--color-gold)" stroke-width="1.5">
        <circle cx="11" cy="11" r="8"></circle>
        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
      </svg>
      <h3 style="font-family:var(--font-display);font-size:1.4rem">Nenhuma peça encontrada</h3>
      <p style="color:var(--color-muted);max-width:420px">Tente buscar por outro termo ou selecione outra categoria.</p>
      <button class="gc-filter-pill" style="background:var(--color-gold);color:white;margin-top:10px" onclick="resetFilters()">Limpar Filtros</button>
    </div>
  </main>

  <!-- Scripts Essenciais de Luxo -->
  <script src="./js/loader.js?v=2026"></script>
  <script src="./js/shared-ui.js?v=2026"></script>
  <script>
    let allProducts = [];
    let currentFilter = 'all';
    let searchQuery = '';

    document.addEventListener('DOMContentLoaded', async () => {
      allProducts = await window.fetchCatalog();

      // Checa parâmetros de URL (ex: ?cat=ela, ?cat=ele, ?cat=calcas-ele, ?cat=noite-ele)
      const urlParams = new URLSearchParams(window.location.search);
      const rawFilter = urlParams.get('cat') || urlParams.get('filtro') || urlParams.get('categoria') || 'all';

      let normalized = rawFilter.toLowerCase();
      if (normalized === 'roupas-noite' || normalized === 'roupas para noite') {
        normalized = 'noite';
      }

      setFilter(normalized);

      // Eventos de filtro
      document.querySelectorAll('#filtersBar .gc-filter-pill').forEach(btn => {
        btn.addEventListener('click', () => {
          setFilter(btn.dataset.filter);
        });
      });

      // Evento de pesquisa
      const searchInput = document.getElementById('catalogSearch');
      if (searchInput) {
        searchInput.addEventListener('input', (e) => {
          searchQuery = e.target.value.trim().toLowerCase();
          renderCatalog();
        });
      }
    });

    function setFilter(filter) {
      currentFilter = filter;
      let matchedPill = false;
      document.querySelectorAll('#filtersBar .gc-filter-pill').forEach(btn => {
        if (btn.dataset.filter === filter) {
          btn.classList.add('active');
          matchedPill = true;
        } else {
          btn.classList.remove('active');
        }
      });
      // Se for uma categoria específica vinda do mega menu que não tenha pílula exata
      if (!matchedPill && filter !== 'all') {
        const allBtn = document.querySelector('#filtersBar .gc-filter-pill[data-filter="all"]');
        if (allBtn) allBtn.classList.remove('active');
      }

      // Atualiza textos do Hero de forma sofisticada e personalizada
      const heroTag = document.querySelector('.gc-page-hero-tag');
      const heroTitle = document.querySelector('.gc-page-hero-title');
      const heroDesc = document.querySelector('.gc-page-hero-desc');
      if (filter === 'ela') {
        if (heroTag) heroTag.textContent = 'Coleção Feminina';
        if (heroTitle) heroTitle.textContent = 'Para Ela — Alta-Costura';
        if (heroDesc) heroDesc.textContent = 'Peças e silhuetas femininas tecidas artesanalmente com caimento impecável e bossa atemporal.';
      } else if (filter === 'ele') {
        if (heroTag) heroTag.textContent = 'Coleção Masculina';
        if (heroTitle) heroTitle.textContent = 'Para Ele — Alfaiataria & Bossa';
        if (heroDesc) heroDesc.textContent = 'Camisas, calças e bermudas masculinas em crochê estruturado e fios nobres para o homem contemporâneo.';
      } else if (filter === 'calcas-ele') {
        if (heroTag) heroTag.textContent = 'Linha Masculina';
        if (heroTitle) heroTitle.textContent = 'Calças & Bermudas — Para Ele';
        if (heroDesc) heroDesc.textContent = 'Peças inferiores da alfaiataria em crochê manual masculino.';
      } else if (filter === 'calcas' || filter === 'calcas-ela') {
        if (heroTag) heroTag.textContent = 'Linha Feminina';
        if (heroTitle) heroTitle.textContent = 'Calças & Shorts — Para Ela';
        if (heroDesc) heroDesc.textContent = 'Shorts e calças autorais com tramas confortáveis e modelagem contemporânea.';
      } else if (filter === 'jaquetas-ele') {
        if (heroTag) heroTag.textContent = 'Linha Masculina';
        if (heroTitle) heroTitle.textContent = 'Jaquetas & Casacos — Para Ele';
      } else if (filter === 'noite-ele') {
        if (heroTag) heroTag.textContent = 'Linha Masculina';
        if (heroTitle) heroTitle.textContent = 'Roupas para Noite — Para Ele';
      } else if (filter === 'favoritos') {
        if (heroTag) heroTag.textContent = 'Coleção Exclusiva Salva';
        if (heroTitle) heroTitle.textContent = 'Meus Favoritos';
        if (heroDesc) heroDesc.textContent = 'Suas peças do coração salvas para encomendar com o concierge do ateliê.';
      } else {
        if (heroTag) heroTag.textContent = 'Catálogo Completo';
        if (heroTitle) heroTitle.textContent = 'Todas as Peças';
        if (heroDesc) heroDesc.textContent = 'Explore nosso acervo completo de criações tecidas à mão. Cada ponto, textura e acabamento é desenhado para durar gerações.';
      }

      renderCatalog();
    }

    function resetFilters() {
      const searchInput = document.getElementById('catalogSearch');
      if (searchInput) searchInput.value = '';
      searchQuery = '';
      setFilter('all');
    }

    function renderCatalog() {
      const grid = document.getElementById('catalogGrid');
      const empty = document.getElementById('catalogEmpty');
      const counter = document.getElementById('resultsCount');
      if (!grid) return;

      const favs = window.GoldFav ? window.GoldFav.list() : [];

      const filtered = allProducts.filter(p => {
        // Normalização de campos do produto
        const cat = (p.category || '').toLowerCase();
        const sec = (p.section || '').toLowerCase();
        const gen = (p.gender || '').toLowerCase();
        const col = (p.collection || '').toLowerCase();
        const name = (p.name || '').toLowerCase();
        const desc = (p.desc || '').toLowerCase();
        const mat = (p.material || '').toLowerCase();

        // 1. Filtro estrito por categoria e gênero
        if (currentFilter && currentFilter !== 'all') {
          if (currentFilter === 'noite') {
            const isNoite = cat.includes('noite') || 
                            name.includes('noite') || 
                            desc.includes('noite') || 
                            desc.includes('gala') || 
                            desc.includes('festa') ||
                            (cat === 'saias-vestidos' && (name.includes('vestido') || desc.includes('vestido')));
            if (!isNoite) return false;
          } else if (currentFilter === 'noite-ele') {
            const isNoite = cat.includes('noite') || name.includes('noite') || desc.includes('noite') || desc.includes('gala') || desc.includes('festa') || cat === 'tops';
            if (!isNoite || gen !== 'masculino') return false;
          } else if (currentFilter === 'noite-ela') {
            const isNoite = cat.includes('noite') || name.includes('noite') || desc.includes('noite') || desc.includes('gala') || desc.includes('festa') || (cat === 'saias-vestidos' && (name.includes('vestido') || desc.includes('vestido')));
            if (!isNoite || gen === 'masculino') return false;
          } else if (currentFilter === 'vestuario') {
            const isVest = cat === 'vestuario' || cat === 'saias-vestidos' || cat === 'tops' || cat === 'calcas' || cat === 'jaquetas-casacos' || sec === 'dia-a-dia';
            if (!isVest) return false;
          } else if (currentFilter === 'saias-vestidos') {
            if (cat !== 'saias-vestidos' && !name.includes('vestido') && !name.includes('saia')) return false;
          } else if (currentFilter === 'tops') {
            if (cat !== 'tops' && !name.includes('camisa') && !name.includes('regata') && !name.includes('top')) return false;
          } else if (currentFilter === 'calcas-ele') {
            const isCalca = cat === 'calcas' || name.includes('calça') || name.includes('bermuda') || name.includes('short');
            if (!isCalca || gen !== 'masculino') return false;
          } else if (currentFilter === 'calcas' || currentFilter === 'calcas-ela') {
            const isCalca = cat === 'calcas' || name.includes('calça') || name.includes('short');
            if (!isCalca || gen === 'masculino') return false;
          } else if (currentFilter === 'jaquetas-ele') {
            const isJaq = cat === 'jaquetas-casacos' || name.includes('jaqueta') || name.includes('casaco');
            if (!isJaq || gen !== 'masculino') return false;
          } else if (currentFilter === 'jaquetas-casacos' || currentFilter === 'jaquetas-ela') {
            const isJaq = cat === 'jaquetas-casacos' || name.includes('jaqueta') || name.includes('casaco');
            if (!isJaq || gen === 'masculino') return false;
          } else if (currentFilter === 'ela') {
            // Estritamente para ela
            if (gen === 'masculino') return false;
            if (gen !== 'feminino' && cat !== 'saias-vestidos') return false;
          } else if (currentFilter === 'ele') {
            // Estritamente para ele
            if (gen !== 'masculino') return false;
          } else if (currentFilter === 'bolsas') {
            if (cat !== 'bolsas' && !name.includes('bolsa')) return false;
          } else if (currentFilter === 'casa') {
            const isCasa = sec === 'casa' || cat === 'decoracoes' || cat === 'mantas' || col.includes('casa gold') || name.includes('jogo americano') || name.includes('celestial');
            if (!isCasa) return false;
          } else if (currentFilter === 'pequeninos' || currentFilter === 'bebe' || currentFilter === 'garotas' || currentFilter === 'garotos' || currentFilter === 'presentes') {
            const isPequenino = cat === 'pequeninos' || cat === 'bebe' || cat === 'garotas' || cat === 'garotos' || cat === 'presentes' || cat === 'amigurumi';
            if (!isPequenino) return false;
          } else if (currentFilter === 'bijuterias' || currentFilter === 'charms' || currentFilter === 'brincos' || currentFilter === 'colares' || currentFilter === 'broches' || currentFilter === 'braceletes' || currentFilter === 'aneis') {
            const isBiju = ['bijuterias', 'charms', 'brincos', 'colares', 'broches', 'braceletes', 'aneis'].includes(cat) || sec === 'bijuterias' || sec === 'acessorios';
            if (!isBiju) return false;
          } else if (currentFilter === 'acessorios') {
            const isAcess = cat === 'bolsas' || sec === 'acessorios' || name.includes('bolsa');
            if (!isAcess) return false;
          } else if (currentFilter === 'personalizado') {
            if (cat !== 'personalizado' && !p.custom) return false;
          } else if (currentFilter === 'favoritos') {
            if (!favs.includes(p.id)) return false;
          } else {
            if (cat !== currentFilter && col !== currentFilter && sec !== currentFilter) {
              return false;
            }
          }
        }

        // 2. Filtro por busca
        if (searchQuery) {
          if (!name.includes(searchQuery) && !desc.includes(searchQuery) && !cat.includes(searchQuery) && !mat.includes(searchQuery) && !col.includes(searchQuery)) {
            return false;
          }
        }

        return true;
      });

      if (counter) {
        counter.textContent = `${filtered.length} ${filtered.length === 1 ? 'peça encontrada' : 'peças encontradas'}`;
      }

      if (filtered.length === 0) {
        grid.style.display = 'none';
        empty.style.display = 'flex';
        return;
      }

      grid.style.display = 'grid';
      empty.style.display = 'none';

      grid.innerHTML = filtered.map(p => {
        const slug = p.slug || 'produto';
        const img = p.image || (p.gallery && p.gallery[0]) || './assets/icon.svg';
        const hasDiscount = p.discount && Number(p.discount) > 0;
        
        let badgeHtml = '';
        if (hasDiscount) {
          badgeHtml = `<span class="gc-badge-discount-vertical">-${p.discount}% OFF</span>`;
        } else if (p.badge) {
          badgeHtml = `<span class="gc-badge-vertical">${p.badge}</span>`;
        }

        let priceHtml = '';
        if (p.price) {
          const originalPrice = Number(p.price);
          if (hasDiscount) {
            const salePrice = originalPrice * (1 - Number(p.discount) / 100);
            priceHtml = `
              <span class="gc-price-old">R$ ${originalPrice.toFixed(2).replace('.', ',')}</span>
              <span class="gc-price-sale">R$ ${salePrice.toFixed(2).replace('.', ',')}</span>
            `;
          } else {
            priceHtml = `<span class="gc-product-price">R$ ${originalPrice.toFixed(2).replace('.', ',')}</span>`;
          }
        } else {
          priceHtml = `<span class="gc-product-price">Sob Consulta</span>`;
        }

        return `
          <div class="gc-product-card" onclick="window.location.href='./produtos/${slug}.html'" style="cursor:pointer">
            <div class="gc-product-card-img-wrap" style="position:relative">
              <div class="gc-img-loader-spinner"></div>
              ${badgeHtml}
              <button class="gc-card-fav-btn" data-id="${p.id}" onclick="event.stopPropagation(); window.GoldFav.toggle(${p.id});" aria-label="Favoritar">
                <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.4">
                  <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path>
                </svg>
              </button>
              <img src="${img}" alt="${p.name}" class="gc-product-card-img" loading="lazy" onload="this.classList.add('loaded'); this.parentElement.querySelector('.gc-img-loader-spinner')?.remove();" onerror="this.src='./assets/icon.svg'; this.parentElement.querySelector('.gc-img-loader-spinner')?.remove();">
            </div>
            <div class="gc-product-card-body">
              <h3 class="gc-product-card-title">${p.name}</h3>
              <div class="gc-product-price-row">
                ${priceHtml}
              </div>
            </div>
          </div>
        `;
      }).join('');

      if (window.GoldFav && window.GoldFav.updateUI) {
        window.GoldFav.updateUI();
      }
    }
  </script>
</body>
</html>
